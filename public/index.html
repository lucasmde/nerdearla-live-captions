<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtítulos en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="brandbar"></div>
<header class="top">
  <div><h1 id="evt">Subtítulos en vivo · Live captions</h1><div class="sub" id="evtSub">Elegí tu sala y tu idioma · Pick your room and language</div></div>
  <span class="badge" id="engine"><span class="dot"></span><span>…</span></span>
</header>
<div class="wrap">
  <div class="grid" id="grid"></div>
  <p class="muted" style="margin-top:28px;font-size:13px">Open source · <a href="https://github.com/lucasmde/nerdearla-live-captions" id="repo">GitHub</a> · hecho para la Vibeathon de Nerdearla 2026</p>
</div>
<script>
async function load() {
  const r = await fetch('/api/sessions'); const d = await r.json();
  document.getElementById('engine').innerHTML = `<span class="dot"></span>${d.engine === 'mock' ? 'modo demo' : 'Gemini'}`;
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  if (d.event) { document.getElementById('evt').textContent = d.event + ' · Subtítulos en vivo'; document.getElementById('evtSub').textContent = 'Elegí tu sala y tu idioma · Hora de Buenos Aires, se actualiza solo'; }
  for (const s of d.sessions) {
    const live = s.status?.live && s.source;
    const el = document.createElement('div'); el.className = 'card'; if (s.color) el.style.setProperty('--c', s.color);
    const ag = s.agenda || {}; const talk = (t, label) => t ? `<div class="talk"><div class="when">${label} · ${t.start}–${t.end}</div><div class="ttl">${esc(t.title)}</div><div class="spk">${esc(t.speaker)}${t.lang ? ` · ${t.lang.toUpperCase()}` : ''}</div></div>` : '';
    el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center">
        <h3><span class="cdot"></span>${esc(s.name)}</h3><span class="badge ${live ? 'live' : 'off'}"><span class="dot"></span>${live ? 'en vivo' : 'sin audio'}</span></div>
      <div class="room">${esc(s.room || '')} · ${s.viewers} viendo</div>
      ${talk(ag.now, 'AHORA') || (ag.next ? '' : (s.talks ? '<div class="talk"><div class="when">SIN CHARLAS AHORA</div></div>' : ''))}${talk(ag.next, 'SIGUE')}
      <div class="langs">${s.targetLangs.map(l => `<a class="pill" href="/s/${s.id}?lang=${l}">${esc(d.langLabels[l] || l)}</a>`).join('')}</div>
      <div class="langs" style="margin-top:8px"><a class="pill" href="/s/${s.id}?lang=es&tv=1" title="Pantalla de sala con QR">📺 pantalla</a><a class="pill" href="/api/sessions/${s.id}/qr.svg" title="QR para imprimir">▦ QR</a></div>`;
    grid.appendChild(el);
  }
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
load(); setInterval(load, 5000);
</script>
</body>
</html>
